<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal A4 Question Paper Generator</title>
    <!-- Standard docx.js for REAL Mobile-compatible Word Export -->
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --bg-image: url('border_bg.jpg');
            --page-width: 210mm;
            --page-height: 297mm;
            --primary-blue: #1a44c2;
            --question-red: #cb1212;
            --answer-green: #228b22;
            --text-dark: #111111;
            --table-header-bg: #e0e7ff;
            --table-border: #93c5fd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #3b3f45;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .no-print-header {
            background-color: #0f172a;
            color: white;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls { display: flex; gap: 10px; align-items: center; }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-word { background-color: #0284c7; }
        .btn-print { background-color: #059669; }

        .file-label {
            background-color: #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        input[type="file"] { display: none; }

        #pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
        }

        /* FIXED A4 PAGE HEIGHT AND OVERFLOW LOGIC */
        .a4-page {
            width: var(--page-width);
            min-height: var(--page-height);
            max-height: var(--page-height);
            background-color: #ffffff;
            background-image: var(--bg-image);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            padding: 20mm 16mm 18mm 16mm;
        }

        .page-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .qa-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .question-header-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .q-number-circle {
            min-width: 38px;
            height: 38px;
            border: 2px solid var(--primary-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13.5pt;
            color: var(--question-red);
            background-color: #ffffff;
        }

        .q-text-box {
            border: 2px solid var(--primary-blue);
            border-radius: 12px;
            padding: 4px 12px;
            background-color: #ffffff;
            font-size: 12.5pt;
            font-weight: 700;
            color: var(--question-red);
            line-height: 1.4;
            max-width: 85%;
        }

        .answer-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }

        .answer-label-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5pt;
            font-weight: 800;
            color: #0d6b12;
        }

        .answer-label-tag {
            border: 2px solid var(--answer-green);
            padding: 1px 8px;
            border-radius: 6px;
            background-color: #ffffff;
        }

        .answer-prefix-text {
            font-size: 11.5pt;
            color: #111111;
            font-weight: 700;
        }

        .answer-box {
            border: 2px dashed var(--answer-green);
            border-radius: 10px;
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.96);
            font-size: 11pt;
            color: #111111;
            font-weight: 600;
            min-height: 25px;
        }

        .diff-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5pt;
            background: #ffffff;
        }

        .diff-table th, .diff-table td {
            border: 1px solid var(--table-border);
            padding: 5px;
            text-align: left;
        }

        .diff-table th { background-color: var(--table-header-bg); color: var(--primary-blue); }

        .mcq-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 10.5pt;
        }

        .mcq-opt {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .answer-box ol, .answer-box ul {
            padding-left: 20px;
        }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            body { background: none; }
            .no-print-header { display: none !important; }
            #pages-container { padding: 0; gap: 0; }
            .a4-page { box-shadow: none; page-break-after: always; print-color-adjust: exact; height: 297mm; }
        }
    </style>
</head>
<body>

    <div class="no-print-header">
        <h1>A4 Exam Paper Generator</h1>
        <div class="controls">
            <label class="file-label" for="jsonFileInput">📂 Load JSON</label>
            <input type="file" id="jsonFileInput" accept=".json">

            <label class="file-label" for="bgFileInput">🖼️ Change Border</label>
            <input type="file" id="bgFileInput" accept="image/*">

            <button class="btn btn-word" onclick="exportToWordReal()">📝 Export Word</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </div>

    <div id="pages-container"></div>

    <script>
        let qaData = [];
        let customBgImage = "";

        function createPageElement() {
            const page = document.createElement('div');
            page.className = 'a4-page';
            if (customBgImage) page.style.backgroundImage = `url('${customBgImage}')`;
            page.innerHTML = `<div class="page-content"></div>`;
            return page;
        }

        function renderAnswerContent(item) {
            const type = item.type || 'plain_text';

            if (type === 'table' || type === 'difference') {
                const headers = item.table_headers || ['क्रमांक', 'भाग A', 'भाग B'];
                const rows = item.table_data || [];
                let html = `<table class="diff-table"><thead><tr>`;
                headers.forEach(h => html += `<th>${h}</th>`);
                html += `</tr></thead><tbody>`;
                rows.forEach(r => {
                    html += `<tr>`;
                    r.forEach(c => html += `<td>${c}</td>`);
                    html += `</tr>`;
                });
                return html + `</tbody></table>`;
            }

            if (type === 'mcq' || type === 'checkbox') {
                const options = item.options || [];
                let html = `<div class="mcq-options-grid">`;
                options.forEach(opt => html += `<div class="mcq-opt">${opt}</div>`);
                html += `</div>`;
                if (item.correct_answer) {
                    html += `<div style="margin-top:4px; color:#15803d; font-weight:700;">✓ सही उत्तर: ${item.correct_answer}</div>`;
                }
                return html;
            }

            if (item.answer_points && item.answer_points.length > 0) {
                let html = `<ol style="padding-left:20px;">`;
                item.answer_points.forEach(pt => html += `<li>${pt}</li>`);
                return html + `</ol>`;
            }

            return `<p style="white-space: pre-line;">${item.answer || item.a || ''}</p>`;
        }

        function createQANode(item, index, isContinued = false) {
            const block = document.createElement('div');
            block.className = 'qa-block';

            const qNo = item.number || (index + 1);
            const questionMain = item.question || item.q || '';
            const answerPrefix = item.answer_prefix || '';

            let html = '';

            if (isContinued) {
                html += `
                    <div style="font-size:10pt; font-weight:bold; color:#2563eb; font-style:italic;">
                        [प्रश्न ${qNo} (आगे का उत्तर - Continued)]
                    </div>
                `;
            } else {
                html += `
                    <div class="question-header-row">
                        <div class="q-number-circle">${qNo}.</div>
                        <div class="q-text-box">प्रश्न ${qNo}. ${questionMain}</div>
                    </div>
                `;
            }

            html += `
                <div class="answer-container">
                    ${!isContinued ? `
                    <div class="answer-label-row">
                        <span class="answer-label-tag">उत्तर</span>
                        <span>➔</span>
                        ${answerPrefix ? `<span class="answer-prefix-text">${answerPrefix}</span>` : ''}
                    </div>` : ''}
                    <div class="answer-box">
                        ${renderAnswerContent(item)}
                    </div>
                </div>
            `;

            block.innerHTML = html;
            return block;
        }

        // PERFECT PAGINATION & MULTI-PAGE SPLITTING ENGINE
        async function renderPages() {
            const container = document.getElementById('pages-container');
            container.innerHTML = '';

            if (!qaData || qaData.length === 0) return;

            let currentPage = createPageElement();
            container.appendChild(currentPage);
            let currentContent = currentPage.querySelector('.page-content');

            // Maximum allowed content height in pixels (A4 print height)
            const MAX_HEIGHT = 920; 

            for (let idx = 0; idx < qaData.length; idx++) {
                const item = qaData[idx];
                let qaNode = createQANode(item, idx);
                currentContent.appendChild(qaNode);

                // Small layout sync
                await new Promise(r => setTimeout(r, 5));

                // Check if adding this question exceeds current page height
                if (currentContent.offsetHeight > MAX_HEIGHT) {
                    currentContent.removeChild(qaNode);

                    // Create new page
                    currentPage = createPageElement();
                    container.appendChild(currentPage);
                    currentContent = currentPage.querySelector('.page-content');

                    // Put question on the new page
                    qaNode = createQANode(item, idx);
                    currentContent.appendChild(qaNode);

                    await new Promise(r => setTimeout(r, 5));

                    // If question is STILL bigger than the whole new page, split it
                    if (currentContent.offsetHeight > MAX_HEIGHT) {
                        currentContent.removeChild(qaNode);
                        let continuedNode = createQANode(item, idx, true);
                        currentContent.appendChild(continuedNode);
                    }
                }
            }
        }

        function exportToWordReal() {
            if (!qaData || qaData.length === 0) {
                alert("Export करने के लिए कोई डेटा नहीं है!");
                return;
            }

            const docxLib = window.docx;
            if (!docxLib) {
                alert("Word Library load nahi hui!");
                return;
            }

            const children = [];

            qaData.forEach((item, idx) => {
                const qNo = item.number || (idx + 1);

                children.push(
                    new docxLib.Paragraph({
                        children: [
                            new docxLib.TextRun({ text: `प्रश्न ${qNo}. ${item.question || ''}`, bold: true, color: "CB1212", size: 24 })
                        ],
                        spacing: { before: 150, after: 80 }
                    })
                );

                if (item.answer_prefix) {
                    children.push(
                        new docxLib.Paragraph({
                            children: [
                                new docxLib.TextRun({ text: `उत्तर ➔ ${item.answer_prefix}`, bold: true, color: "0D6B12", size: 22 })
                            ]
                        })
                    );
                }

                if (item.answer) {
                    children.push(
                        new docxLib.Paragraph({
                            children: [
                                new docxLib.TextRun({ text: item.answer, size: 20 })
                            ],
                            spacing: { after: 150 }
                        })
                    );
                }

                if (item.answer_points) {
                    item.answer_points.forEach(pt => {
                        children.push(
                            new docxLib.Paragraph({
                                text: pt,
                                bullet: { level: 0 }
                            })
                        );
                    });
                }
            });

            const doc = new docxLib.Document({
                sections: [{ children: children }]
            });

            docxLib.Packer.toBlob(doc).then(blob => {
                saveAs(blob, "Question_Paper.docx");
            });
        }

        document.getElementById('jsonFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    qaData = JSON.parse(evt.target.result);
                    renderPages();
                } catch (err) {
                    alert("JSON File me error hai!");
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('bgFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                customBgImage = evt.target.result;
                renderPages();
            };
            reader.readAsDataURL(file);
        });

        async function loadDefaultDataJSON() {
            try {
                const response = await fetch('data.json');
                if (response.ok) {
                    qaData = await response.json();
                    renderPages();
                }
            } catch (err) {}
        }

        window.onload = loadDefaultDataJSON;
    </script>
</body>
</html>
